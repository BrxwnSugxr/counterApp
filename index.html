<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Dhikr — Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="grain" width="0" height="0">
      <filter id="noise">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.9"
          numOctaves="2"
          stitchTiles="stitch"
        />
      </filter>
    </svg>
    <div class="grain" style="filter: url(#noise); background: #000"></div>

    <div class="app">
      <header>
        <div class="wordmark">
          <span class="word"
            >dhikr<svg
              class="scribble"
              viewBox="0 0 80 12"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <path d="M2 6 C 18 2, 34 10, 50 5 S 70 2, 78 6" /></svg
          ></span>
          counter
        </div>
        <div class="header-actions">
          <button
            id="minusBtn"
            class="icon-btn"
            title="Subtract one count"
            aria-label="Subtract one from count"
          >
            −
          </button>
          <button
            id="resetBtn"
            class="icon-btn"
            title="Reset today's count"
            aria-label="Reset today's count"
          >
            ⟲
          </button>
        </div>
      </header>

      <div
        class="phrase-card"
        id="tapZone"
        role="button"
        tabindex="0"
        aria-label="Tap to count"
      >
        <div class="toast" id="toast"></div>
        <div id="primaryText"></div>
        <div class="translit" id="translitText"></div>

        <div class="necklace-wrap">
          <svg id="necklace" viewBox="0 0 320 300"></svg>
          <div class="margin-note" id="marginNote">
            start here
            <svg class="note-arrow" viewBox="0 0 40 40" aria-hidden="true">
              <path d="M4 4 C 10 14, 14 22, 22 30" />
              <path d="M14 27 L22 30 L20 21" />
            </svg>
          </div>
        </div>

        <div class="lap-info" id="lapInfo">Lap 1</div>
        <div class="count-big" id="countBig">0</div>
        <div class="meaning" id="meaningText"></div>
        <div class="footline">
          <span class="hint" id="hint"
            >tap anywhere, as many times as you need</span
          >
        </div>
      </div>

      <div class="visually-hidden" id="liveRegion" aria-live="polite"></div>

      <div>
        <div class="section-label">Target</div>
        <div class="chip-row" id="targets"></div>
      </div>

      <div>
        <div class="section-label">Track</div>
        <div class="chip-row" id="tracks"></div>
        <button id="addTrackBtn" class="add-track-btn">+ Add a zikir</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span id="statToday">0</span><label>Today</label>
        </div>
        <div class="stat">
          <span id="statStreak">0</span><label>Day streak</label>
        </div>
        <div class="stat">
          <span id="statLifetime">0</span><label>Lifetime</label>
        </div>
      </div>

      <div class="colophon">
        made for slow mornings and long queues — count as many as you need
      </div>
    </div>

    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title">Add a zikir</div>
        <div class="modal-sub">
          Type it however you say it — Arabic script or transliteration both
          work.
        </div>
        <div class="field-label">Phrase</div>
        <input
          id="inputPhrase"
          class="field-input"
          type="text"
          placeholder="e.g. يا لطيف or Ya Latif"
          maxlength="60"
        />
        <div class="field-label">Meaning (optional)</div>
        <input
          id="inputMeaning"
          class="field-input"
          type="text"
          placeholder="e.g. O Most Gentle"
          maxlength="80"
        />
        <div class="modal-actions">
          <button id="modalCancel" class="btn btn-ghost">Cancel</button>
          <button id="modalAdd" class="btn btn-primary" disabled>Add</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="targetModalOverlay">
      <div class="modal-card">
        <div class="modal-title">Set a target</div>
        <div class="field-label">Number of counts</div>
        <input
          id="inputTarget"
          class="field-input"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          placeholder="e.g. 250"
        />
        <div class="modal-actions">
          <button id="targetModalCancel" class="btn btn-ghost">Cancel</button>
          <button id="targetModalSet" class="btn btn-primary" disabled>
            Set
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
